version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database
      - DB_NAME=uni_resource_agent
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
    depends_on:
      - database
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  database:
    image: postgres:13
    environment:
      - POSTGRES_DB=uni_resource_agent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: