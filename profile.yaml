# profile.yaml — 非机密运行配置（唯一 YAML 配置文件）
#
# 优先级（低 -> 高）：
#   1. 代码内置默认值
#   2. 本文件 profile.yaml
#   3. 环境变量 DB_* / LLM_*（.env 或 shell 导出；真实 shell 环境优先）
#
# 机密凭据（数据库口令、LLM 密钥）必须通过环境变量提供，禁止写入本文件。

database:
  host: localhost
  port: 5432
  name: unires
  user: unires

llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3-coder-80b
  temperature: 0.1
